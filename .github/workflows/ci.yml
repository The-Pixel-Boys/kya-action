name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Script tests (stub + published CLI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the published CLI
        run: |
          npm i -g @shield-agent/kya@latest
          npm ls -g @shield-agent/kya

      - name: Run tests
        env:
          REQUIRE_REAL_KYA: "1"
        run: bash tests/run.sh

  certify:
    name: Self-dogfood kya certify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run kya certify on this repo
        id: kya
        uses: ./
        with:
          fail-on: never
          comment-on-pr: "true"

      # Skip the upload on error: a symlinked .kya would otherwise be followed
      # into the artifact.
      - name: Upload certify artifacts
        if: ${{ always() && steps.kya.outputs.status != 'error' }}
        uses: actions/upload-artifact@v4
        with:
          name: kya-certify-report
          path: .kya/certify/
          if-no-files-found: warn
