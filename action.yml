name: "KYA Certify"
description: >-
  Run kya certify (Know Your Agent trust baseline) in CI and post the gap
  summary as a PR comment.
author: "Shield Agent"
branding:
  icon: shield
  color: purple

inputs:
  fail-on:
    description: >-
      When the workflow should fail. One of: `gap` (fail if any gap is found)
      or `never` (report only, never fail). Maps to `kya certify --fail-on`,
      which accepts exactly these two values.
    required: false
    default: "gap"
  window-days:
    description: "Look-back window in days for agent-activity evidence. Maps to `kya certify --window`."
    required: false
    default: "30"
  comment-on-pr:
    description: "Post the certify gap summary as a comment on pull requests."
    required: false
    default: "true"
  kya-version:
    description: "Version of the `@shield-agent/kya` npm package to install."
    required: false
    default: "latest"

outputs:
  exit-code:
    description: "Exit code of `kya certify` (0 = clean, 1 = gaps, 2+ = error). Empty when certify was not run because the report path is unsafe."
    value: ${{ steps.certify.outputs.exit-code }}
  status:
    description: "Certify outcome: `pass`, `gap`, or `error`. A PROJECT_PATH_REFUSED refusal or a symlinked `.kya` report path is `error`, never `gap`."
    value: ${{ steps.certify.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install KYA
      shell: bash
      env:
        KYA_VERSION: ${{ inputs.kya-version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"

    - name: Run kya certify
      id: certify
      continue-on-error: ${{ inputs.fail-on == 'never' }}
      shell: bash
      env:
        KYA_WINDOW_DAYS: ${{ inputs.window-days }}
        KYA_FAIL_ON: ${{ inputs.fail-on }}
      run: bash "$GITHUB_ACTION_PATH/scripts/certify.sh"

    - name: Comment certify summary on PR
      if: ${{ always() && inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        KYA_REPORT_PATH: ${{ steps.certify.outputs.report-path }}
        KYA_EXIT_CODE: ${{ steps.certify.outputs.exit-code }}
        KYA_STATUS: ${{ steps.certify.outputs.status }}
        KYA_WINDOW_DAYS: ${{ inputs.window-days }}
        KYA_FAIL_ON: ${{ inputs.fail-on }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          // certify.sh only sets KYA_REPORT_PATH after checking that the report
          // and its parents are not symlinks and stay inside the workspace;
          // O_NOFOLLOW refuses a leaf link planted after that check.
          let report = null;
          const reportPath = process.env.KYA_REPORT_PATH || '';
          if (reportPath) {
            try {
              const fd = fs.openSync(reportPath, fs.constants.O_RDONLY | (fs.constants.O_NOFOLLOW || 0));
              try {
                report = JSON.parse(fs.readFileSync(fd, 'utf8'));
              } finally {
                fs.closeSync(fd);
              }
            } catch (e) {
              core.warning(`Could not read the certify report: ${e.message}`);
            }
          }

          const exitCode = process.env.KYA_EXIT_CODE || 'n/a';
          const status = process.env.KYA_STATUS || 'error';
          const windowInput = process.env.KYA_WINDOW_DAYS || '';
          const failOn = process.env.KYA_FAIL_ON || '';

          const pill = status === 'pass'
            ? '![passing](https://img.shields.io/badge/KYA%20Certified-passing-green)'
            : status === 'gap'
              ? '![gaps](https://img.shields.io/badge/KYA%20Certified-gaps-red)'
              : '![error](https://img.shields.io/badge/KYA%20Certified-error-yellow)';

          const requirements = Array.isArray(report?.requirements) ? report.requirements : [];
          const severityRank = { critical: 0, high: 1, medium: 2, low: 3 };
          const gaps = requirements
            .filter(r => r.status !== 'pass')
            .sort((a, b) => (severityRank[a.severity] ?? 9) - (severityRank[b.severity] ?? 9));

          const firstSentence = (text) => {
            if (!text) return '';
            // evidence is usually "summary — remediation hint"; keep the summary
            const summary = String(text).split(/\s+—\s+/)[0].trim();
            const m = summary.match(/^.*?[.!?](?=\s|$)/);
            return (m ? m[0] : summary.slice(0, 160)).trim();
          };

          const lines = [
            `${pill} **KYA Agent Trust Baseline**`,
            '',
            `- Status: **${status}** (exit code ${exitCode})`,
          ];
          if (report?.overall) {
            const o = report.overall;
            const parts = [];
            if (typeof o.pass === 'number') parts.push(`${o.pass} passed`);
            if (typeof o.gap === 'number') parts.push(`${o.gap} gap(s)`);
            if (typeof o.insufficientEvidence === 'number') parts.push(`${o.insufficientEvidence} insufficient evidence`);
            if (parts.length > 0) lines.push(`- Requirements: ${parts.join(', ')}`);
          } else if (requirements.length > 0) {
            lines.push(`- Requirements: ${requirements.length - gaps.length} passed, ${gaps.length} gap(s)`);
          }
          const windowDays = report?.window?.days ?? windowInput;
          let statsLine = `- Window: ${windowDays} days · fail-on: '${failOn}'`;
          if (typeof report?.trail?.eventCount === 'number') {
            statsLine += ` · ${report.trail.eventCount} trail events`;
          }
          lines.push(statsLine);

          const top = gaps.slice(0, 5);
          if (top.length > 0) {
            lines.push('', '**Top gaps**', '');
            for (const g of top) {
              const hint = firstSentence(g.evidence);
              lines.push(`- \`${g.id}\` [${g.severity}] **${g.title}**${hint ? ` — ${hint}` : ''}`);
            }
          }

          if (!report) {
            lines.push('', status === 'error'
              ? '> _Certify ended in an error, so no report is shown. See the workflow logs for details._'
              : '> _No JSON report found in `.kya/certify/`. See the workflow logs for details._');
          }

          const marker = '<!-- kya-certify-report -->';
          const body = `${marker}\n${lines.join('\n')}`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
